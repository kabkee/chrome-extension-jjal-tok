<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>짤톡</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>💬 짤톡</h1>
      <div class="header-actions">
        <button id="helpBtn" class="help-btn" title="사용법 보기">❓</button>
        <button id="openFolderBtn" class="folder-btn">📁 폴더 열기</button>
      </div>
    </header>

    <div id="gifList" class="gif-list">
      <div class="empty-state">
        <p>저장된 GIF가 없습니다</p>
        <p class="hint">웹페이지에서 GIF를 더블클릭하여 저장하세요</p>
      </div>
    </div>
  </div>

  <!-- 사용법 모달 -->
  <div id="helpModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>📌 짤톡 사용법</h2>
        <button id="closeModal" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <ol>
          <li><strong>GIF 저장하기:</strong><br>웹페이지에서 GIF를 더블클릭하거나 우클릭 → "짤톡에 저장"</li>
          <li><strong>저장된 GIF 확인:</strong><br>팝업에서 썸네일을 클릭하면 파일 위치가 열립니다</li>
          <li><strong>카카오톡으로 전송:</strong><br>파일을 카카오톡 채팅창으로 드래그하여 전송!</li>
        </ol>
        <p class="tip">💡 <strong>Tip:</strong> 최대 20개의 GIF가 자동으로 관리됩니다</p>
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>

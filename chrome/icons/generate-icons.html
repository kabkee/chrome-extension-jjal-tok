<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>아이콘 생성기</title>
</head>
<body>
  <h1>짤톡 아이콘 생성</h1>
  <canvas id="canvas16" width="16" height="16"></canvas>
  <canvas id="canvas48" width="48" height="48"></canvas>
  <canvas id="canvas128" width="128" height="128"></canvas>
  
  <div id="downloads"></div>

  <script>
    const svgContent = `<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect x="10" y="15" width="108" height="85" rx="15" fill="url(#grad1)"/>
  <path d="M 35 100 L 25 115 L 45 105 Z" fill="url(#grad1)"/>
  <text x="64" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">GIF</text>
  <path d="M 40 70 L 88 70 L 88 65 L 98 75 L 88 85 L 88 80 L 40 80 Z" fill="white" opacity="0.9"/>
  <circle cx="100" cy="25" r="12" fill="#FEE500"/>
  <ellipse cx="100" cy="24" rx="8" ry="6" fill="#3C1E1E"/>
</svg>`;

    function generateIcon(size) {
      return new Promise((resolve) => {
        const canvas = document.getElementById(`canvas${size}`);
        const ctx = canvas.getContext('2d');
        
        const img = new Image();
        const blob = new Blob([svgContent], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);
        
        img.onload = () => {
          ctx.drawImage(img, 0, 0, size, size);
          URL.revokeObjectURL(url);
          
          canvas.toBlob((blob) => {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `icon${size}.png`;
            link.textContent = `icon${size}.png 다운로드`;
            link.style.display = 'block';
            link.style.margin = '10px';
            document.getElementById('downloads').appendChild(link);
            
            link.click();
            resolve();
          });
        };
        
        img.src = url;
      });
    }

    async function generateAll() {
      await generateIcon(16);
      await generateIcon(48);
      await generateIcon(128);
      alert('모든 아이콘이 생성되었습니다!');
    }

    generateAll();
  </script>
</body>
</html>
